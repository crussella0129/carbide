[package]
name = "carbide-ui"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Carbide's pure-Rust front-end — an egui/eframe app, native and WebAssembly."

# Its own workspace root: the heavy egui/winit dependency tree is kept out
# of the engine workspace so `cargo build --workspace` there stays lean.
[workspace]

[dependencies]
eframe = "0.37"
egui = "0.37"
carbide-core = { path = "../../crates/carbide-core" }
carbide-tess = { path = "../../crates/carbide-tess" }
carbide-formula = { path = "../../crates/carbide-formula" }
carbide-store = { path = "../../crates/carbide-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
base64 = "0.22"

# rfd 0.18 handles wasm targets cleanly in its build script without requiring
# any native Linux backend feature (superseding ADR-003's rfd 0.14 `gtk3`
# workaround). Native targets use default backends (xdg-portal + wayland on
# Linux, ComDlg32 on Windows, AppKit on macOS).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = { version = "0.18", default-features = false }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }

[profile.release]
opt-level = 2
